# start global config
global:
  scrape_timeout: 10s
  scrape_interval: 15s
  evaluation_interval: 15s
scrape_configs:
  - job_name: "prometheus"
    # metrics_path defaults to '/metrics'
    # scheme defaults to 'http'.
    static_configs:
      - targets: [ "prometheus:9090" ]
  - job_name: tekticket-server
    static_configs:
      - targets: [ "app:8080" ]
  - job_name: 'node_exporter'
    static_configs:
      - targets: [ 'node-exporter:9100' ]
