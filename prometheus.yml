# start global config
global:
  scrape_timeout: 10s
  scrape_interval: 15s
  evaluation_interval: 15s
scrape_configs:
  - job_name: "prometheus"
    # metrics_path defaults to '/metrics'
    # scheme defaults to 'http'.
    static_configs:
      - targets: [ "localhost:9090" ]
  - job_name: tekticket-server
    static_configs:
      - targets: [ "localhost:8080" ]
